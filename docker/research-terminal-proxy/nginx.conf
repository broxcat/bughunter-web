worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    location = /health { default_type application/json; return 200 '{"status":"ok"}'; }
    location /research-terminal/ {
      # The browser automatically attaches same-origin cookies. They terminate
      # at trusted ingress and never reach the Research service/processes.
      set $console_backend research-console:7681;
      proxy_pass http://$console_backend;
      proxy_http_version 1.1;
      proxy_pass_request_headers off;
      proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
      proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_set_header Proxy-Authorization "";
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
      proxy_buffering off;
      proxy_next_upstream off;
      proxy_connect_timeout 3s;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
    location / { return 404; }
  }
}
