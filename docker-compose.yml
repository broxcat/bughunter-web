# bughunter-web — private Tailscale ingress + web + worker + postgres + redis.
#
#   docker compose build          # build the shared app/scanner image
#   docker compose up -d          # start the stack (authkey_tailscale.txt required)
#   docker compose logs -f web    # follow web logs (or: worker / db / redis)
#
# First boot only — apply the Prisma migrations against the running db:
#   docker compose exec web npx prisma migrate deploy
#
# `web` and `worker` share the SAME image (built from ./Dockerfile). They differ
# only in command: web runs `next start`, worker runs the tsx scan worker.
# Both get NET_RAW + NET_ADMIN so in-container nmap can do -sV / SYN scans.

services:
  # Only ingress to the stack: no service publishes a host port. Userspace
  # networking keeps this node independent from the host's Tailscale client
  # and needs neither /dev/net/tun nor NET_ADMIN. Serve never enables Funnel.
  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    hostname: bughunter
    environment:
      TS_AUTHKEY: file:/run/secrets/tailscale_authkey
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: bughunter
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    secrets:
      - tailscale_authkey
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./docker/tailscale:/config:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    image: bughunter-web
    command: npm run start
    # Reachable through the dedicated Tailscale node on port 3000 only.
    env_file: .env
    environment:
      # Auth.js must use the browser-visible origin, not a container hostname.
      AUTH_URL: "${AUTH_URL:?Set AUTH_URL to the Tailscale origin used in your browser}"
      RESEARCH_EMBEDDING_URL: "${RESEARCH_EMBEDDING_URL:-}"
      RESEARCH_EMBEDDING_MODEL: "${RESEARCH_EMBEDDING_MODEL:-}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped

  worker:
    build: .
    image: bughunter-web
    command: npm run worker
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # The worker launches headless Chromium (via playwright-chromium) to confirm
    # DOM-XSS. Chromium's own sandbox relies on unprivileged user namespaces,
    # which aren't reliably available inside a container without granting broad
    # caps (e.g. SYS_ADMIN) or shipping a custom seccomp profile — both of which
    # would weaken this container more than the feature is worth. Instead the
    # worker launches Chromium with --no-sandbox (passed in code), which is the
    # standard trade-off for containerized headless Chromium: the container is
    # already the isolation boundary, and NO extra caps/privileges are added
    # here. A larger /dev/shm keeps the renderer from crashing on busy pages
    # (the alternative is the --disable-dev-shm-usage Chromium flag in code).
    shm_size: "1gb"
    restart: unless-stopped

  # Out-of-band interaction catcher (Phase 5). Same image as web/worker, only
  # the command differs (like worker). It logs every inbound /oob/<token>
  # request to the shared Postgres OobHit table so the worker can CONFIRM blind
  # SSRF by correlation (no worker->catcher HTTP).
  #
  # Tailscale Serve forwards port 8089 privately, with no host publication.
  # OOB_PUBLIC_BASE_URL must be reachable by the scanned target: targets outside
  # the tailnet need a separately operated callback service. Needs no Redis or caps.
  oob-catcher:
    build: .
    image: bughunter-web
    command: npx tsx src/server/oob/server.ts
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  tailscale-state:

secrets:
  tailscale_authkey:
    file: ./authkey_tailscale.txt
