# bughunter-web — private Tailscale ingress + web + worker + postgres + redis.
#
#   docker compose build          # build the shared app/scanner image
#   docker compose up -d          # start the stack (authkey_tailscale.txt required)
#   docker compose logs -f web    # follow web logs (or: worker / db / redis)
#
# First boot only — apply the Prisma migrations against the running db:
#   docker compose exec web npx prisma migrate deploy
#
# `web` and `worker` share the SAME image (built from ./Dockerfile). They differ
# only in command: web runs `next start`, worker runs the tsx scan worker.
#
# Secrets (H2): no service loads the whole .env. Compose reads .env only to
# interpolate the variables below, and each service receives the minimum it
# uses. Every app service runs as the unprivileged image user with all Linux
# capabilities dropped and no-new-privileges (nmap/raw sockets are disabled).

x-hardened-service: &hardened-service
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# Variables used by both web and worker. Interpolated from .env; never the
# whole file. REDIS_URL is built here so it always carries the password.
x-shared-runtime-env: &shared-runtime-env
  DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL}"
  REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD (openssl rand -hex 32)}@redis:6379"
  CREDENTIALS_ENCRYPTION_KEY: "${CREDENTIALS_ENCRYPTION_KEY:?Set CREDENTIALS_ENCRYPTION_KEY}"
  CREDENTIALS_ENCRYPTION_KEY_ID: "${CREDENTIALS_ENCRYPTION_KEY_ID:-primary}"
  CREDENTIALS_ENCRYPTION_LEGACY_KEY_ID: "${CREDENTIALS_ENCRYPTION_LEGACY_KEY_ID:-primary}"
  CREDENTIALS_ENCRYPTION_PREVIOUS_KEYS: "${CREDENTIALS_ENCRYPTION_PREVIOUS_KEYS:-{}}"
  TARGET_CAMPAIGN_MAX_ACTIVE: "${TARGET_CAMPAIGN_MAX_ACTIVE:-3}"
  TARGET_SESSION_TTL_MINUTES: "${TARGET_SESSION_TTL_MINUTES:-}"
  DEFAULT_USER_AGENT: "${DEFAULT_USER_AGENT:-}"
  HUNTER_USERNAME: "${HUNTER_USERNAME:-}"
  OOB_PUBLIC_BASE_URL: "${OOB_PUBLIC_BASE_URL:-}"
  OLLAMA_HOST: "${OLLAMA_HOST:-}"
  RESEARCH_EMBEDDING_URL: "${RESEARCH_EMBEDDING_URL:-}"
  RESEARCH_EMBEDDING_MODEL: "${RESEARCH_EMBEDDING_MODEL:-}"
  EGRESS_LAB_ALLOWLIST: "${EGRESS_LAB_ALLOWLIST:-}"
  BROWSER_SANDBOX: "${BROWSER_SANDBOX:-enabled}"
  BROWSER_SOCKET_PATH: /run/browser/broker.sock
  LOG_LEVEL: "${LOG_LEVEL:-info}"

services:
  # Only ingress to the stack: no service publishes a host port. Userspace
  # networking keeps this node independent from the host's Tailscale client
  # and needs neither /dev/net/tun nor NET_ADMIN. Serve never enables Funnel.
  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    hostname: bughunter
    environment:
      TS_AUTHKEY: file:/run/secrets/tailscale_authkey
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: bughunter
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    secrets:
      - tailscale_authkey
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./docker/tailscale:/config:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # B4: authentication required. Clients receive REDIS_URL with this password.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --appendfsync always --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD (openssl rand -hex 32)}"
      REDISCLI_AUTH: "${REDIS_PASSWORD}"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    image: bughunter-web
    command: npm run start
    # Reachable through the dedicated Tailscale node on port 3000 only.
    environment:
      <<: [*shared-runtime-env]
      # Auth.js must use the browser-visible origin, not a container hostname.
      AUTH_URL: "${AUTH_URL:?Set AUTH_URL to the Tailscale origin used in your browser}"
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET}"
      ALLOW_PUBLIC_REGISTRATION: "${ALLOW_PUBLIC_REGISTRATION:-false}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      TRUSTED_PROXY_HOPS: "${TRUSTED_PROXY_HOPS:-1}"
      GITHUB_ID: "${GITHUB_ID:-}"
      GITHUB_SECRET: "${GITHUB_SECRET:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      PDF_EXPORT_MAX_CONCURRENCY: "${PDF_EXPORT_MAX_CONCURRENCY:-1}"
      SESSION_MAX_AGE_HOURS: "${SESSION_MAX_AGE_HOURS:-12}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser:
        condition: service_healthy
    <<: *hardened-service
    volumes:
      - browser-socket:/run/browser
    restart: unless-stopped

  worker:
    build: .
    image: bughunter-web
    command: npm run worker
    # No AUTH_SECRET, OAuth or registration settings: the worker never signs
    # sessions. Chromium executes only in the networkless browser service.
    environment:
      <<: [*shared-runtime-env]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser:
        condition: service_healthy
    <<: *hardened-service
    volumes:
      - browser-socket:/run/browser
    restart: unless-stopped

  browser:
    build: ./docker/browser
    image: bughunter-browser
    network_mode: none
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/browser/seccomp.json
    pids_limit: 1024
    mem_limit: 2g
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,uid=10001,gid=10001
    shm_size: "1gb"
    volumes:
      - browser-socket:/run/browser
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect('/run/browser/broker.sock');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),1000).unref()"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Out-of-band interaction catcher (Phase 5). Same image as web/worker, only
  # the command differs (like worker). It logs every inbound /oob/<token>
  # request to the shared Postgres OobHit table so the worker can CONFIRM blind
  # SSRF by correlation (no worker->catcher HTTP).
  #
  # Tailscale Serve forwards port 8089 privately, with no host publication.
  # OOB_PUBLIC_BASE_URL must be reachable by the scanned target: targets outside
  # the tailnet need a separately operated callback service. It parses untrusted
  # input, so it receives only the database URL: no Redis, keys or caps.
  oob-catcher:
    build: .
    image: bughunter-web
    command: npx tsx src/server/oob/server.ts
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    depends_on:
      db:
        condition: service_healthy
    <<: *hardened-service
    restart: unless-stopped

volumes:
  browser-socket:
  pgdata:
  redisdata:
  tailscale-state:

secrets:
  tailscale_authkey:
    file: ./authkey_tailscale.txt
