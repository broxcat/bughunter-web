# bughunter-web — full local stack: web + worker + postgres + redis.
#
#   docker compose build          # build the shared app/scanner image
#   docker compose up -d          # start all four services
#   docker compose logs -f web    # follow web logs (or: worker / db / redis)
#
# First boot only — apply the Prisma migrations against the running db:
#   docker compose exec web npx prisma migrate deploy
#
# `web` and `worker` share the SAME image (built from ./Dockerfile). They differ
# only in command: web runs `next start`, worker runs the tsx scan worker.
# Both get NET_RAW + NET_ADMIN so in-container nmap can do -sV / SYN scans.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    image: bughunter-web
    command: npm run start
    # Ingress exclusively through Tailscale Serve on the frontend network.
    expose:
      - "3000"
    env_file: .env
    environment:
      # .env is also Compose's interpolation source; never pass provisioning
      # credentials through the application's shared env_file.
      TAILSCALE_BUGHUNTER_AUTHKEY: ""
      # Auth.js must use the browser-visible origin, not a container hostname.
      AUTH_URL: "${AUTH_URL:?Set AUTH_URL to the public origin used in your browser}"
      RESEARCH_WORKSPACE_ROOT: /research-workspaces
      RESEARCH_WORKSPACE_GID: "${RESEARCH_WORKSPACE_GID:-1000}"
      RESEARCH_WORKSPACE_UID: "${RESEARCH_WORKSPACE_UID:-1000}"
      RESEARCH_CONSOLE_ROOT: /research-target-workspaces
      RESEARCH_TERMINAL_PRIVATE_KEY_FILE: /run/research-terminal/private.pem
    volumes:
      - research-workspaces:/research-workspaces
      - type: bind
        source: ${RESEARCH_HOST_ROOT:-/home/brokcat/bughunter-research}
        target: /research-target-workspaces
        bind:
          create_host_path: false
      - type: bind
        source: ./data/research-terminal/private.pem
        target: /run/research-terminal/private.pem
        read_only: true
        bind:
          create_host_path: false
    networks:
      default:
        gw_priority: 1
      tailscale_frontend:
      research_terminal:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped

  worker:
    build: .
    image: bughunter-web
    command: npm run worker
    env_file: .env
    environment:
      TAILSCALE_BUGHUNTER_AUTHKEY: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # The worker launches headless Chromium (via playwright-chromium) to confirm
    # DOM-XSS. Chromium's own sandbox relies on unprivileged user namespaces,
    # which aren't reliably available inside a container without granting broad
    # caps (e.g. SYS_ADMIN) or shipping a custom seccomp profile — both of which
    # would weaken this container more than the feature is worth. Instead the
    # worker launches Chromium with --no-sandbox (passed in code), which is the
    # standard trade-off for containerized headless Chromium: the container is
    # already the isolation boundary, and NO extra caps/privileges are added
    # here. A larger /dev/shm keeps the renderer from crashing on busy pages
    # (the alternative is the --disable-dev-shm-usage Chromium flag in code).
    shm_size: "1gb"
    restart: unless-stopped

  # Out-of-band interaction catcher (Phase 5). Same image as web/worker, only
  # the command differs (like worker). It logs every inbound /oob/<token>
  # request to the shared Postgres OobHit table so the worker can CONFIRM blind
  # SSRF by correlation (no worker->catcher HTTP).
  #
  # The "8089:8089" mapping PUBLISHES the catcher to the host. This is how the
  # SCANNED TARGET reaches it: the scanner embeds a callback URL built from
  # OOB_PUBLIC_BASE_URL (operator-set, e.g. http://100.121.43.68:8089 for the
  # Tailscale host). The target connects to the host's 8089, Docker forwards it
  # into this container, a row lands in OobHit. Needs no redis and no NET_* caps.
  oob-catcher:
    build: .
    image: bughunter-web
    command: npx tsx src/server/oob/server.ts
    ports:
      - "8089:8089"
    env_file: .env
    environment:
      TAILSCALE_BUGHUNTER_AUTHKEY: ""
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Permanent per-target PTY/tmux/Codex environment. No application env_file.
  research-console:
    init: true
    build:
      context: .
      dockerfile: docker/research/Dockerfile
      args:
        RESEARCH_WORKSPACE_UID: "${RESEARCH_WORKSPACE_UID:-1000}"
        RESEARCH_WORKSPACE_GID: "${RESEARCH_WORKSPACE_GID:-1000}"
    image: bughunter-research
    environment:
      RESEARCH_TERMINAL_ORIGIN: "${AUTH_URL:?Set AUTH_URL to the browser origin}"
      RESEARCH_TERMINAL_PUBLIC_KEY_FILE: /run/research-terminal/public.pem
      BURP_SERVICE_HOST: "${BURP_SERVICE_HOST-burp-private}"
      BURP_MCP_HOST: "${BURP_MCP_HOST:-127.0.0.1}"
      BURP_MCP_PORT: "${BURP_MCP_PORT:-9876}"
      BURP_PROXY_HOST: "${BURP_PROXY_HOST:-127.0.0.1}"
      BURP_PROXY_PORT: "${BURP_PROXY_PORT:-8080}"
    expose: ["7681"]
    ports:
      - "127.0.0.1:${RESEARCH_SSH_PORT:-2222}:22"
    networks: [research_egress, research_terminal, burp_link]
    volumes:
      - type: bind
        source: ${RESEARCH_HOST_ROOT:-/home/brokcat/bughunter-research}
        target: /workspaces
        bind:
          create_host_path: false
      - research-workspaces:/legacy-workspaces
      - research-codex:/home/researcher/.codex
      - research-claude:/home/researcher/.claude
      - research-host-keys:/etc/ssh/host-keys
      - research-identities:/var/lib/bughunter-identities
      - research-private-homes:/var/lib/bughunter-homes
      - type: bind
        source: ./data/research-ssh
        target: /run/research-keys
        read_only: true
      - type: bind
        source: ./data/research-terminal/public.pem
        target: /run/research-terminal/public.pem
        read_only: true
        bind:
          create_host_path: false
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # sshd/setpriv alone authenticate and drop to researcher; Codex/Node are non-root.
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, SYS_CHROOT, FOWNER, KILL, SETPCAP]
    pids_limit: 512
    mem_limit: 3g
    shm_size: 1g
    restart: unless-stopped

  # Optional existing Community instance with independent network lifetime.
  # Private forwarding ports are reachable only through burp_link; no host ports.
  # Existing external Burp + SSH bridge remains supported without this profile.
  burp:
    profiles: [burp]
    build:
      context: .
      dockerfile: docker/burp/Dockerfile
    image: bughunter-burp
    networks:
      research_egress: {}
      burp_link:
        aliases: [burp-private]
    environment:
      BURP_PRIVATE_FORWARD: "yes"
      BURP_ACCEPT_TERMS: "${BURP_ACCEPT_TERMS:-no}"
    volumes:
      - burp-home:/home/burp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; from pathlib import Path; assert Path('/tmp/bughunter-burp-ready').exists(); socket.create_connection(('127.0.0.1',9876),2).close()"]
      interval: 15s
      start_period: 90s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Same-origin cookie stripping before the isolated terminal. No secrets or host ports.
  research-terminal-proxy:
    build:
      context: .
      dockerfile: docker/research-terminal-proxy/Dockerfile
    image: bughunter-research-terminal-proxy
    networks: [research_terminal]
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 64m
    restart: unless-stopped

  # Explicit profile for this project identity. Only Serve's HTTPS listener is exposed
  # inside the tailnet. No host ports, subnet routing, Funnel or egress proxy.
  tailscale-bughunter:
    image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    profiles: [tailscale]
    environment:
      TS_AUTHKEY: "${TAILSCALE_BUGHUNTER_AUTHKEY:-}"
      TS_HOSTNAME: "${TAILSCALE_BUGHUNTER_HOSTNAME:-bughunter-web}"
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_EXTRA_ARGS: --advertise-tags=tag:bughunter --accept-routes=false
      TS_SERVE_CONFIG: /etc/bughunter-tailscale/serve.json
    volumes:
      - tailscale-bughunter-state:/var/lib/tailscale
      # Mount the directory so containerboot can watch Serve config updates.
      - ./docker/tailscale:/etc/bughunter-tailscale:ro
    networks:
      - tailscale_frontend
      - research_terminal
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "sh", "/etc/bughunter-tailscale/healthcheck.sh"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    restart: unless-stopped

networks:
  # Only ingress sidecar + console; web/worker/db/redis do not join this network.
  research_terminal:
    driver: bridge
    internal: true
  burp_link:
    internal: true
  research_egress:
    driver: bridge
  # Keep the original default network and its egress for Recon/Ollama.
  # The frontend also needs internet egress for Tailscale control/DERP.
  tailscale_frontend:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  tailscale-bughunter-state:
  research-workspaces:
  research-codex:
  research-claude:
  research-host-keys:
  research-identities:
  research-private-homes:
  burp-home:
