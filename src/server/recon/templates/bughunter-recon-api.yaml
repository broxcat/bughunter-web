id: bughunter-recon-api
info:
  name: Public API declaration
  author: bughunter
  severity: info
  tags: recon,tech,surface
  metadata:
    version: 2.0.0
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: false
    max-redirects: 0
    matchers:
      - type: word
        part: body
        words: ['"openapi"', '"swagger"', '"graphql"']
