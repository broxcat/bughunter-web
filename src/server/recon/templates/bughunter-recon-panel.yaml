id: bughunter-recon-panel
info:
  name: Authentication or panel surface
  author: bughunter
  severity: info
  tags: recon,tech,surface
  metadata:
    version: 2.0.0
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: false
    max-redirects: 0
    matchers:
      - type: regex
        part: body
        regex: ['(?i)(login|sign in|admin|dashboard|type="password")']
