id: bughunter-recon-headers
info:
  name: HTTP header surface
  author: bughunter
  severity: info
  tags: recon,tech,surface
  metadata:
    version: 2.0.0
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: false
    max-redirects: 0
    matchers:
      - type: status
        status: [200, 204, 301, 302, 307, 308, 400, 401, 403, 404, 405, 429, 500, 502, 503]
